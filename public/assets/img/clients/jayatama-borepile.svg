<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="200" height="120" fill="#f5f5f5" rx="4"/>
  
  <!-- Border -->
  <rect width="200" height="120" fill="none" stroke="#ddd" stroke-width="1" rx="4"/>
  
  <!-- Company initial/logo area -->
  <circle cx="60" cy="60" r="28" fill="#1f2937" opacity="0.1"/>
  <text x="60" y="68" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif">JB</text>
  
  <!-- Company name -->
  <text x="100" y="45" font-size="12" font-weight="600" text-anchor="start" fill="#1f2937" font-family="Arial, sans-serif">Jayatama</text>
  <text x="100" y="62" font-size="12" font-weight="600" text-anchor="start" fill="#1f2937" font-family="Arial, sans-serif">Borepile</text>
</svg>
